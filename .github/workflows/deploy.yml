# Build the site and deploy it to Cloudflare Workers on every push to main.
#
# public/data/ is generated locally (`npm run data`) and committed, so CI
# does not call png.quran.ws: it only typechecks and bundles what is in git.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (permissions: Workers Scripts
# Edit, D1 Edit) and CLOUDFLARE_ACCOUNT_ID.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:site

      # Schema first, so the new Worker never runs against old tables.
      - run: npx wrangler d1 migrations apply DB --remote

      - run: npx wrangler deploy
